<!DOCTYPE html>
<html>
<head>
  <title>{{ brand.product }} — Teller Console</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:{{ brand.banner_bg }}; }
    .shell { display:flex; height:100vh; }
    iframe { border:0; }
    #nav { width:190px; }
    #main { flex:1; }

</head>
<body>
  <div class="shell">
    <iframe name="nav" id="nav" src="/nav" title="Navigation"></iframe>
    <iframe name="main" id="main" src="/welcome" title="Main"></iframe>
  </div>
</body>
</html>
